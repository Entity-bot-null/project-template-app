# Local development: `pnpm dev` starts PostgreSQL, Redis and Mailpit
# (`pnpm services:up`), then the API and the landing on the host. `pnpm db:up`
# starts PostgreSQL alone. The mobile app runs apart (`pnpm start`,
# `pnpm android`).
#
# The ports are the web template's plus 10 (docs/adr/0002-pnpm-monorepo.md),
# so both templates run on one machine at once; the project name keeps their
# containers and volumes apart.
#
# Optional, started only when asked for (docs/architecture.md):
#   docker compose --profile observability up -d   OpenTelemetry backend + Grafana (development)
#
# Production-like stack built from the Dockerfiles (profile "stack"):
# migrations, then the API behind the web server at http://localhost:8090 (the
# landing at /, the app's links at /app/*, the API at /api).
#   docker compose --profile stack up --build
# Reads JWT_ACCESS_SECRET from a root .env (see .env.example). Not a
# deployment: no TLS, local credentials, nothing published beyond loopback.
name: template-app

services:
  db:
    # Pinned by digest, the same as CI's (scripts/tool-images/Dockerfile);
    # Dependabot proposes updates.
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      # Local development only. Published on loopback only.
      POSTGRES_PASSWORD: app
    ports:
      - '127.0.0.1:${DB_PORT:-5452}:5432'
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      # TCP on purpose: during the first initdb the server listens on the
      # Unix socket only, which would pass a socket check and then restart.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Development mail catcher (docs/manual.md): every message the API sends
  # locally lands here, nothing leaves the machine. Its web UI lists them; the
  # integration specs and the app's end-to-end flows against the real API read
  # them through its API. Published on loopback only, and never part of a
  # deployment: it accepts mail from anyone who can reach it, without
  # authentication or TLS, so the API refuses an SMTP server without TLS in
  # production (MAIL_SMTP_URL). Messages live in memory: they are gone after
  # `docker compose down`. Chaos (MP_ENABLE_CHAOS) only arms Mailpit's API to
  # inject SMTP errors on demand (the outbox specs do, then disarm it).
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_ENABLE_CHAOS: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1045}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8045}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    profiles: [stack]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [stack]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-local}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app:app@db:5432/app
      # One proxy hop: the web container, which replaces X-Forwarded-For.
      TRUST_PROXY: '1'
      # Empty when unset: the API then refuses to boot and names the variable.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      APP_ENVIRONMENT: stack
      # Redis below, as in a deployment: shared rate limits, cache, locks and
      # idempotency, and a readiness that fails without it. STACK_REDIS_URL
      # points the stack at another Redis.
      REDIS_URL: ${STACK_REDIS_URL:-redis://:${REDIS_PASSWORD:-app}@redis:6379}
      RATE_LIMIT_STORE: ${STACK_RATE_LIMIT_STORE:-redis}
      CACHE_STORE: ${STACK_CACHE_STORE:-redis}
      REDIS_REQUIRED: 'true'
      # The oldest app versions the API serves (semver; unset: any).
      MOBILE_MIN_VERSION_IOS: ${STACK_MOBILE_MIN_VERSION_IOS:-}
      MOBILE_MIN_VERSION_ANDROID: ${STACK_MOBILE_MIN_VERSION_ANDROID:-}
      # Optional integrations, off unless set in the root .env (.env.example):
      # with the observability profile, STACK_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318.
      SENTRY_DSN: ${STACK_SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${STACK_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Push notifications to a phone with a build that points at the stack.
      PUSH_ENABLED: ${STACK_PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${STACK_EXPO_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The web image (apps/landing/Dockerfile): the landing, the app's links and
  # their files, and /api forwarded to the API above. The app's identity for
  # those files comes from the root .env when set (STACK_APPLE_TEAM_ID...);
  # without it they answer 404, as an unconfigured deployment does.
  web:
    profiles: [stack]
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-local}
    environment:
      API_UPSTREAM: http://api:3000
      # The address the stack is opened at: the landing's absolute links.
      APP_ORIGIN: http://localhost:${STACK_PORT:-8090}
      APPLE_TEAM_ID: ${STACK_APPLE_TEAM_ID:-}
      IOS_BUNDLE_ID: ${STACK_IOS_BUNDLE_ID:-}
      ANDROID_PACKAGE: ${STACK_ANDROID_PACKAGE:-}
      ANDROID_SHA256_CERT_FINGERPRINTS: ${STACK_ANDROID_SHA256_CERT_FINGERPRINTS:-}
    ports:
      - '127.0.0.1:${STACK_PORT:-8090}:8080'
    depends_on:
      api:
        condition: service_healthy

  # Redis for shared rate limits, cache, locks and idempotency
  # (docs/architecture.md#redis), started with the database, as in a
  # deployment. The application still runs without it (it degrades), so the
  # adapters' fallbacks keep their tests. Secure defaults: a password
  # (REDIS_PASSWORD in the root .env; "app" when unset, local development only,
  # like the database's), published on loopback only and on 6399, not Redis's
  # 6379, so it does not collide with a Redis installed on the machine. It runs
  # as the redis user, keeps its data (AOF, fsync every second) and evicts only
  # keys that have a TTL when full: every key the template writes has one, so
  # future keys without a TTL (queues) are never dropped. `exec` makes
  # redis-server PID 1: SIGTERM reaches it and it saves before exiting.
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-app}
    command:
      - sh
      - -c
      - |
        test -n "$$REDIS_PASSWORD" || { echo 'REDIS_PASSWORD is empty: set it in the root .env (openssl rand -hex 24)' >&2; exit 1; }
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - '127.0.0.1:${REDIS_PORT:-6399}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      # The password reaches redis-cli through its environment, not its arguments.
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  # Optional, development only: an OpenTelemetry backend on this machine
  # (collector, Prometheus, Tempo, Loki and Grafana in one image), to see the
  # API's traces and metrics before choosing a provider. Then, in
  # apps/api/.env: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4328, and
  # Grafana at http://localhost:3011 (anonymous admin: loopback only, never
  # deploy this service). docs/observability.md#local-backend.
  otel-lgtm:
    profiles: [observability]
    image: grafana/otel-lgtm:0.37.0@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07
    ports:
      - '127.0.0.1:${OTLP_HTTP_PORT:-4328}:4318'
      - '127.0.0.1:${GRAFANA_PORT:-3011}:3000'
      - '127.0.0.1:${PROMETHEUS_PORT:-9100}:9090'
    # The dashboards and alert rules of observability/, read-only: Grafana
    # shows them in the folder "Application", Prometheus evaluates the rules
    # (docs/observability.md#dashboards-and-alerts-as-code).
    volumes:
      - ./observability/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/prometheus/rules:/otel-lgtm/rules:ro
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/application.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/application-dashboards:ro

volumes:
  db_data:
  redis_data:
