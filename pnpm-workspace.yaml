# pnpm settings of this repository: a workspace with one package per app in
# apps/ (apps/mobile, the Expo app; docs/adr/0002-pnpm-monorepo.md). Isolated
# installs (pnpm's default) are supported by Expo since SDK 54: every import
# must be a declared dependency of the package that makes it, nothing works
# by accident through hoisting. (Native Android builds on Windows need a
# hoisted node_modules on that machine only: docs/testing.md#end-to-end.)
packages:
  - apps/*

# Fail the install on a Node.js version outside package.json "engines".
engineStrict: true

# Supply chain: a version must be public for seven days before it can be
# installed, so a hijacked release is usually caught and pulled before it
# reaches us. Dependabot waits as long (cooldown). For an urgent security fix,
# exempt that exact version in a minimumReleaseAgeExclude list
# (name@1.2.3, never a name or a pattern) and record it, with its reason and
# the date it is old enough, in scripts/dependency-policy.json: `pnpm
# deps:check` fails from that date until both entries are deleted
# (SECURITY.md#dependency-policy).
minimumReleaseAge: 10080

# Supply chain: a new version published with weaker evidence than its earlier
# ones (for example without the provenance or trusted publisher they had) is
# refused: the typical sign of a stolen maintainer token. Versions older than
# 30 days are not compared (a shorter window fails `pnpm deps:check`).
# Exempt a reviewed package with trustPolicyExclude, recorded with its reason
# in scripts/dependency-policy.json.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

# Supply chain: only the dependencies declared in package.json may come from
# a git repository or a tarball URL; a transitive one doing so fails the
# install, since it bypasses the registry and its integrity checks.
blockExoticSubdeps: true

# Supply chain: dependencies may run install scripts only when listed here
# with true, an exception recorded with its reason in
# scripts/dependency-policy.json (`pnpm deps:check` fails on any other). pnpm
# stops the install when a new dependency wants to run one, so every addition
# is a reviewed decision.
allowBuilds:
  # Each one ships its native binary as a platform package in
  # optionalDependencies (locked with integrity); the install script only
  # checks it, falls back to a download, or (@parcel/watcher, the file
  # watcher of Jest 30's haste map) builds from source when asked to.
  '@sentry/cli': false
  unrs-resolver: false
  '@parcel/watcher': false
  # The API (apps/api). argon2's install script picks the prebuilt binding
  # for the platform, or builds it: the native password hashing.
  argon2: true
  # The Prisma CLI and engines download their platform binaries, checked
  # against the release's checksums.
  '@prisma/engines': true
  prisma: true
  # Telemetry only.
  '@scarf/scarf': false

# Optional dependencies that are never installed. sharp is the raster image
# optimizer Astro offers (apps/landing): the landing uses vector images only,
# with Astro's no-op image service (apps/landing/astro.config.mjs), and the
# libvips binaries sharp brings are LGPL-3.0-or-later, outside the license
# policy (scripts/dependency-policy.json).
ignoredOptionalDependencies:
  - sharp

# Security overrides: transitive versions forced past a published advisory
# until the dependency that pins them ships the fix, or, within the range a
# dependency accepts, because `pnpm update` moves direct dependencies only.
# Each entry names the advisory; delete it once `pnpm why <package>` shows a
# fixed version without the override (SECURITY.md#known-advisories).
overrides:
  # GHSA-68fv-2mgg-jv7q (high): postcss in Expo's Metro config, build time only.
  source-map-js: ^1.2.2
  # GHSA-pqg4-j6r4-53mv (critical): react-devtools-core in React Native,
  # development tooling only.
  shell-quote: ^1.11.0
  # GHSA-ggr8-5vv4-36mx (high), pinned at 7.1.5 by @prisma/config 7.10 (the
  # API's Prisma CLI and client).
  '@prisma/config>deepmerge-ts': ^8.0.2
  # GHSA-3f6p-5ww8-9rcr (high) and GHSA-rgwj-5xj2-c3m3 (moderate), pinned at
  # 3.15.3 by the prisma CLI 7.10 (MySQL support; the API uses PostgreSQL).
  'prisma>mysql2': ^3.24.5
  # GHSA-q7qp-rjg7-q26m (high), pinned at 2.4.0 by @nestjs/platform-express
  # 12.1.3 (no route of the API takes uploads; it is in the image).
  '@nestjs/platform-express>multer': ^2.5.0
  # GHSA-27r3-jxmh-p828 (high), within express 5's ^2.2.1: every JSON route of
  # the API inflates compressed bodies.
  'express>body-parser': ^2.4.0
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr (moderate) and two low ones,
  # within ajv's ^3.0.1 (development tools: commitlint, secretlint, the Nest
  # CLI, the Prisma CLI, astro check).
  'ajv>fast-uri': ^3.1.9
  # GHSA-5x38-2vff-x55p, GHSA-7wch-p9px-956x, GHSA-8hrf-8g6f-7xwp,
  # GHSA-hqq3-7jhf-c5jx, GHSA-jc66-7q78-782g (high), GHSA-525v-9gp9-w22h,
  # GHSA-5cwg-6vw7-rj6p, GHSA-6wvx-3r32-xmcg (moderate) and three low ones:
  # @expo/cli and @expo/code-signing-certificates pin 1.4.0 (update
  # code-signing helpers, development tools only).
  node-forge: ^1.4.1
  # GHSA-4528-x5fx-h6hg (high): the optional peer of @hookform/resolvers'
  # joi resolver, auto-installed at 17.13.8. Narrowed, it is no longer
  # installed at all (the app validates with zod; joi is never imported).
  '@hookform/resolvers>joi': ^17.13.9

# Advisories `pnpm audit` (pnpm security, CI) skips, each reviewed: no fixed
# version exists, and the package never reaches the app binary. `pnpm
# deps:check` lists them on every run; re-check each one when Expo or React
# Native updates, and delete it as soon as a fix ships
# (SECURITY.md#known-advisories).
audit:
  ignore:
    # zod <4.6.6 (high), memory exhausted validating oversized constrained
    # collections: @expo/cli's zod 3 (every @expo/cli up to 58.1.15 requires
    # ^3.25.76, and no 3.x is fixed), a development tool validating its own
    # configuration. The app and the API use zod 4.6.7.
    - GHSA-mrhx-c7xc-m3w5
