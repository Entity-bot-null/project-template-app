# Password recovery: signed out, a link asked from sign-in, a new password
# chosen on the phone, and a sign-in with it.
appId: ${APP_ID}
name: Password recovery
env:
  # REQUIERE CONFIGURACIÓN: the e2e variant of app.config.ts (<identifier>.e2e, <scheme>-e2e).
  APP_ID: com.example.templateapp.e2e
  SCHEME: templateapp-e2e
---
- evalScript: ${output.password = 'a recovered e2e passphrase'}
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: settings-sign-out
- tapOn:
    id: settings-sign-out
- tapOn: (?i)sign out
- extendedWaitUntil:
    visible:
      id: sign-in-forgot-password
    timeout: 15000
- tapOn:
    id: sign-in-forgot-password
- tapOn:
    id: forgot-password-email
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: forgot-password-submit
- extendedWaitUntil:
    visible:
      id: forgot-password-sent
    timeout: 15000

- runFlow:
    file: helpers/open-emailed-link.yaml
    env:
      TO: ${output.email}
      SCREEN: reset-password
- extendedWaitUntil:
    visible:
      id: reset-password-screen
    timeout: 15000
- tapOn:
    id: reset-password-password
- inputText: ${output.password}
- tapOn:
    id: reset-password-repeat
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: reset-password-submit
- extendedWaitUntil:
    visible:
      id: reset-password-done
    timeout: 15000
- tapOn: Continue
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 15000
- tapOn:
    id: sign-in-email
- eraseText
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: items-list
    timeout: 15000
