# The account journeys that need email (pnpm test:e2e:mobile:stack), read
# from the local Mailpit. Run after the main suite (../config.yaml), on the
# same e2e build, against the API through the e2e proxy (localhost:4010 on the
# device: adb reverse tcp:4010 tcp:4010). See apps/mobile/.maestro/README.md
# and docs/testing.md#end-to-end.
#
# One flow, account-journeys.yaml, runs the journeys (journeys/) in order on
# one account; helpers/ holds what they share.
flows:
  - '*.yaml'
executionOrder:
  continueOnFailure: false
