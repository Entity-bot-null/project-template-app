# Maestro workspace (pnpm test:e2e:mobile). The flows run in this order and share
# the installed app's state: each one starts where the previous one ended,
# like a user's first session. See apps/mobile/.maestro/README.md.
flows:
  - flows/*.yaml
executionOrder:
  # The first failure stops the sequence: the flows after it would only fail
  # because of it, burying the real cause.
  continueOnFailure: false
  # The flows' `name:` values, not their file names: with a name declared,
  # Maestro (2.10) does not recognize the file name here, runs the flows as
  # an unordered set, and ignores continueOnFailure.
  flowsOrder:
    - Onboarding and sign-in
    - Session survives a restart
    - Items
    - Server errors
    - Offline and back online
    - Session ends while in use
    - Deep links
    - Sign out
