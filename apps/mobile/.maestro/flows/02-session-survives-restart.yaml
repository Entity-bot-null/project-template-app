# The session is restored from secure storage on the next launch: no sign-in.
appId: ${APP_ID}
name: Session survives a restart
env:
  # REQUIERE CONFIGURACIÓN: the e2e variant of app.config.ts (<identifier>.e2e, <scheme>-e2e).
  APP_ID: com.example.templateapp.e2e
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: items-list
    timeout: 15000
- assertNotVisible:
    id: sign-in-screen
