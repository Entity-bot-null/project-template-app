# Included in every location that serves content: nginx drops the inherited
# add_header directives as soon as a location declares one of its own.
# The CSP allows this origin only, and no script at all: the landing ships
# HTML and CSS (apps/landing/performance-budget.json holds its JavaScript at
# 0 kB). Widen it per directive, in review, when a page needs it
# (docs/security.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# No Referer from any page: the open-in-app page is reached from one-time
# links (their token rides in the fragment, which no Referer carries, but
# nothing here reads the header either).
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Strict-Transport-Security belongs to the TLS-terminating proxy in front of
# this container (docs/security.md#https).
