# Links from outside the app: an accepted one opens its screen, anything
# else lands on the home screen (src/lib/links.ts).
appId: ${APP_ID}
name: Deep links
env:
  APP_ID: com.example.templateapp.e2e
  SCHEME: templateapp-e2e
---
- openLink: ${SCHEME}://items/item-3
- extendedWaitUntil:
    visible:
      id: item-detail-screen
    timeout: 10000
- assertVisible: Example item number 3.
- back

- openLink: ${SCHEME}://admin/delete-everything
- extendedWaitUntil:
    visible:
      id: items-list
    timeout: 10000
