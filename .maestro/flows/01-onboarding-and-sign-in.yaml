# First launch on a clean install: onboarding, then sign-in with validation,
# a wrong password, the API refusing more attempts (429) and a connection that
# drops before the answer, then the right password.
appId: ${APP_ID}
name: Onboarding and sign-in
env:
  # REQUIERE CONFIGURACIÓN: the e2e variant of app.config.ts (<identifier>.e2e, <scheme>-e2e).
  APP_ID: com.example.templateapp.e2e
# Pass or fail, the mock API answers normally for the next flow.
onFlowComplete:
  - runScript:
      file: ../scripts/mock-api.js
      env:
        CONTROL: faults/clear
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: onboarding-screen
- assertVisible: Welcome
- tapOn:
    id: onboarding-continue

- assertVisible:
    id: sign-in-screen
# Validation runs on the device, before anything is sent.
- tapOn:
    id: sign-in-submit
- assertVisible: Enter your email address
- assertVisible: Enter your password
- tapOn:
    id: sign-in-email
- inputText: not-an-email
- hideKeyboard
- tapOn:
    id: sign-in-submit
- assertVisible: Enter a valid email address

- tapOn:
    id: sign-in-email
- eraseText
- inputText: member@example.com
- tapOn:
    id: sign-in-password
- inputText: wrong-password
- hideKeyboard
- tapOn:
    id: sign-in-submit
- assertVisible: Wrong email or password.

- tapOn:
    id: sign-in-password
- eraseText
- inputText: member-password
- hideKeyboard

# The API refuses more attempts for now (429): the user is told to wait.
- runScript:
    file: ../scripts/mock-api.js
    env:
      CONTROL: faults
      ROUTE: POST /api/auth/sign-in
      STATUS: '429'
- tapOn:
    id: sign-in-submit
- assertVisible: Too many attempts. Wait a moment and try again.

# The connection drops before any answer (a failure of the device's network
# stack, which Jest can only imitate): the user is told to check it.
- runScript:
    file: ../scripts/mock-api.js
    env:
      CONTROL: faults
      ROUTE: POST /api/auth/sign-in
      STATUS: '0'
- tapOn:
    id: sign-in-submit
- assertVisible: You seem to be offline. Check your connection and try again.

- runScript:
    file: ../scripts/mock-api.js
    env:
      CONTROL: faults/clear
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: items-list
    timeout: 15000
