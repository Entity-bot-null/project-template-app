# Unit tests of api-alerts.yaml with synthetic series: `pnpm observability:check`
# runs them with promtool (docs/observability.md#dashboards-and-alerts-as-code).
# "1+6x10" is 1, 7, 13... one value per interval; "_" is a missing sample.
rule_files:
  - ../rules/api-alerts.yaml

evaluation_interval: 1m

tests:
  # The orchestrator probes every 10 seconds and every probe fails.
  - name: readiness failing for minutes pages
    interval: 1m
    input_series:
      - series: 'app_server_errors_total{job="api", deployment_environment_name="production", instance="i-1", error_origin="unavailable", http_route="/api/health/ready"}'
        values: '1+6x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: ApiReadinessFailing
        exp_alerts: []
      - eval_time: 5m
        alertname: ApiReadinessFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: api
              deployment_environment_name: production
              instance: i-1
            exp_annotations:
              summary: 'API instance i-1 fails its readiness probe (api, production)'
              description: 'GET /api/health/ready answered 503 12 times in the last 2 minutes: the orchestrator takes the instance out of rotation. The reason is in the "Readiness:" warning of its log.'
              runbook_url: docs/incident-response.md#2-readiness-failing
              dashboard_uid: app-api

  # One 503 while an instance drains for a deployment, then nothing.
  - name: a single readiness failure does not page
    interval: 1m
    input_series:
      - series: 'app_server_errors_total{job="api", deployment_environment_name="production", instance="i-1", error_origin="unavailable", http_route="/api/health/ready"}'
        values: '1x3 2x8'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiReadinessFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: ApiReadinessFailing
        exp_alerts: []

  # Other deliberate 503s (a feature switched off) are not readiness.
  - name: other unavailable answers are not readiness failures
    interval: 1m
    input_series:
      - series: 'app_server_errors_total{job="api", deployment_environment_name="production", instance="i-1", error_origin="unavailable", http_route="/api/users"}'
        values: '1+6x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiReadinessFailing
        exp_alerts: []

  - name: no API metrics for 10 minutes warns
    interval: 1m
    input_series:
      - series: 'process_cpu_time_seconds_total{job="api", deployment_environment_name="production", instance="i-1", cpu_mode="user"}'
        values: '0+1x20 _x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: ApiMetricsAbsent
        exp_alerts: []
      - eval_time: 31m
        alertname: ApiMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
            exp_annotations:
              summary: 'No metrics from the API for 10 minutes (api)'
              description: 'Either no API instance is running (the uptime checks page for that) or its OTLP export stopped reaching this backend; the SLO alerts cannot fire meanwhile. Check the instances, then OTEL_EXPORTER_OTLP_ENDPOINT and the collector.'
              runbook_url: docs/incident-response.md#1-api-down
              dashboard_uid: app-api

  - name: database errors for minutes page, a single burst does not
    interval: 1m
    input_series:
      - series: 'app_server_errors_total{job="api", deployment_environment_name="production", instance="i-1", error_origin="database", http_route="/api/users"}'
        values: '1+3x10'
      - series: 'app_server_errors_total{job="api", deployment_environment_name="staging", instance="i-2", error_origin="database", http_route="/api/users"}'
        values: '1x3 5x8'
    alert_rule_test:
      - eval_time: 8m
        alertname: ApiDatabaseErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              job: api
              deployment_environment_name: production
            exp_annotations:
              summary: 'API requests fail on the database (api, production)'
              description: '6 responses in the last 2 minutes were 5xx caused by the database, for more than 2 minutes.'
              runbook_url: docs/incident-response.md#3-database-unavailable
              dashboard_uid: app-api

  # /api/users: 10 % of 600 requests a minute fail. /api/reports: every
  # request fails, but there are only 10 in 10 minutes.
  - name: one route answering many 5xx warns, with enough traffic
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/users", http_response_status_code="200"}'
        values: '0+540x40'
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/users", http_response_status_code="500"}'
        values: '0+60x40'
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/reports", http_response_status_code="500"}'
        values: '0+1x40'
    alert_rule_test:
      # Pending: true for less than the 10 minutes of "for".
      - eval_time: 8m
        alertname: ApiRouteErrorRatioHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: ApiRouteErrorRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              http_route: /api/users
            exp_annotations:
              summary: '/api/users answers too many 5xx (api, production)'
              description: '10% of its responses over the last 10 minutes were 5xx (threshold 5 %).'
              runbook_url: docs/incident-response.md#5-high-5xx-rate
              dashboard_uid: app-api

  # Each minute 100 requests: 50 within 250 ms, 80 within 500 ms, all
  # within 1 s, so p95 = 0.5 + (95 - 80) / (100 - 80) × 0.5 s = 875 ms.
  # Sign-in is as slow but excluded (password hashing is slow on purpose).
  - name: p95 above 500 ms on a route warns, authentication excluded
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/users", http_response_status_code="200", le="0.25"}'
        values: '0+50x40'
      - series: 'http_server_request_duration_seconds_bucket{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/users", http_response_status_code="200", le="0.5"}'
        values: '0+80x40'
      - series: 'http_server_request_duration_seconds_bucket{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/users", http_response_status_code="200", le="1"}'
        values: '0+100x40'
      - series: 'http_server_request_duration_seconds_bucket{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/users", http_response_status_code="200", le="+Inf"}'
        values: '0+100x40'
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/users", http_response_status_code="200"}'
        values: '0+100x40'
      - series: 'http_server_request_duration_seconds_bucket{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/auth/sign-in", http_response_status_code="200", le="0.5"}'
        values: '0+0x40'
      - series: 'http_server_request_duration_seconds_bucket{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/auth/sign-in", http_response_status_code="200", le="+Inf"}'
        values: '0+100x40'
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/auth/sign-in", http_response_status_code="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiRouteLatencyHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: ApiRouteLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              http_route: /api/users
            exp_annotations:
              summary: '/api/users is slow: p95 above 500 ms (api, production)'
              description: 'p95 over the last 10 minutes: 875ms, for more than 15 minutes.'
              runbook_url: docs/incident-response.md#6-high-latency
              dashboard_uid: app-api

  - name: features running on their fallback warn
    interval: 1m
    input_series:
      - series: 'app_degraded_operations_total{job="api", deployment_environment_name="production", instance="i-1", feature="rate_limit", dependency_name="redis"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: ApiDegradedMode
        exp_alerts: []
      - eval_time: 12m
        alertname: ApiDegradedMode
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              feature: rate_limit
              dependency_name: redis
            exp_annotations:
              summary: 'rate_limit runs degraded: redis unavailable (api, production)'
              description: '50 operations in the last 5 minutes were served by the fallback, for more than 5 minutes.'
              runbook_url: docs/incident-response.md#4-redis-unavailable
              dashboard_uid: app-api

  # billing: 3 of 30 calls a minute time out. maps: all calls succeed.
  - name: a failing external dependency warns
    interval: 1m
    input_series:
      - series: 'app_dependency_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", dependency_name="billing", outcome="success", http_response_status_code="200"}'
        values: '0+27x40'
      - series: 'app_dependency_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", dependency_name="billing", outcome="timeout"}'
        values: '0+3x40'
      - series: 'app_dependency_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", dependency_name="maps", outcome="success", http_response_status_code="200"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: ApiDependencyFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              dependency_name: billing
            exp_annotations:
              summary: 'Calls to billing fail (api, production)'
              description: '10% of the calls over the last 10 minutes failed (threshold 5 %).'
              runbook_url: docs/incident-response.md#12-external-dependency-outage
              dashboard_uid: app-api

  - name: requests waiting for a database connection warn
    interval: 1m
    input_series:
      - series: 'db_client_connection_pending_requests{job="api", deployment_environment_name="production", instance="i-1", db_client_connection_pool_name="pool"}'
        values: '0 0 3x10'
      - series: 'db_client_connection_pending_requests{job="api", deployment_environment_name="production", instance="i-2", db_client_connection_pool_name="pool"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiDatabasePoolSaturated
        exp_alerts: []
      - eval_time: 8m
        alertname: ApiDatabasePoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              instance: i-1
            exp_annotations:
              summary: 'Requests wait for a database connection on i-1 (api, production)'
              description: '3 requests are waiting for a connection of the pool, for more than 5 minutes.'
              runbook_url: docs/incident-response.md#6-high-latency
              dashboard_uid: app-api

  - name: a blocked event loop warns
    interval: 1m
    input_series:
      - series: 'nodejs_eventloop_delay_p99_seconds{job="api", deployment_environment_name="production", instance="i-1"}'
        values: '0.35x20'
      - series: 'nodejs_eventloop_delay_p99_seconds{job="api", deployment_environment_name="production", instance="i-2"}'
        values: '0.02x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiEventLoopDelayHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: ApiEventLoopDelayHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              instance: i-1
            exp_annotations:
              summary: 'Event loop delay above 200 ms on i-1 (api, production)'
              description: 'p99 event loop delay: 350ms, for more than 15 minutes (CPU starvation or blocking work).'
              runbook_url: docs/incident-response.md#7-memory-or-cpu-pressure
              dashboard_uid: app-api

  # The queue's oldest message ages a minute a minute: nothing leaves it.
  - name: an email backlog that lasts warns
    interval: 1m
    input_series:
      - series: 'app_mail_outbox_oldest_age_seconds{job="api", deployment_environment_name="production", instance="i-1"}'
        values: '0+60x40'
      - series: 'app_mail_outbox_oldest_age_seconds{job="api", deployment_environment_name="production", instance="i-2"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiMailBacklog
        exp_alerts: []
      - eval_time: 30m
        alertname: ApiMailBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
            exp_annotations:
              summary: 'Email waits in the outbox (api, production)'
              description: 'The oldest message waiting to be sent is 30m 0s old, for more than 10 minutes. Links in password resets and confirmations expire before they arrive.'
              runbook_url: docs/incident-response.md#16-email-not-delivered
              dashboard_uid: app-api

  # A queue that drains, even slowly, does not warn.
  - name: a short email backlog does not warn
    interval: 1m
    input_series:
      - series: 'app_mail_outbox_oldest_age_seconds{job="api", deployment_environment_name="production", instance="i-1"}'
        values: '0+60x10 0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiMailBacklog
        exp_alerts: []

  - name: email given up on warns
    interval: 1m
    input_series:
      - series: 'app_mail_deliveries_total{job="api", deployment_environment_name="production", instance="i-1", mail_kind="test", outcome="failed"}'
        values: '0x5 1 2 3x30'
      - series: 'app_mail_deliveries_total{job="api", deployment_environment_name="production", instance="i-1", mail_kind="test", outcome="sent"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: ApiMailDeliveryFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: ApiMailDeliveryFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              mail_kind: test
            exp_annotations:
              summary: 'test email was given up on (api, production)'
              description: '3 message(s) failed for good in the last 30 minutes (refused by the SMTP server, or out of attempts).'
              runbook_url: docs/incident-response.md#16-email-not-delivered
              dashboard_uid: app-api

  # The push queue's oldest notification ages a minute a minute: nothing leaves it.
  - name: a push backlog that lasts warns
    interval: 1m
    input_series:
      - series: 'app_push_outbox_oldest_age_seconds{job="api", deployment_environment_name="production", instance="i-1"}'
        values: '0+60x40'
      - series: 'app_push_outbox_oldest_age_seconds{job="api", deployment_environment_name="production", instance="i-2"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiPushBacklog
        exp_alerts: []
      - eval_time: 30m
        alertname: ApiPushBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
            exp_annotations:
              summary: 'Push notifications wait in the outbox (api, production)'
              description: 'The oldest notification waiting to be sent is 30m 0s old, for more than 10 minutes. Security notices reach the phones late.'
              runbook_url: docs/incident-response.md#19-push-notifications-not-delivered
              dashboard_uid: app-api

  # A queue that drains, even slowly, does not warn.
  - name: a short push backlog does not warn
    interval: 1m
    input_series:
      - series: 'app_push_outbox_oldest_age_seconds{job="api", deployment_environment_name="production", instance="i-1"}'
        values: '0+60x10 0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiPushBacklog
        exp_alerts: []

  - name: push notifications given up on warn
    interval: 1m
    input_series:
      - series: 'app_push_deliveries_total{job="api", deployment_environment_name="production", instance="i-1", push_kind="password_changed", outcome="failed"}'
        values: '0x5 1 2x30'
      - series: 'app_push_deliveries_total{job="api", deployment_environment_name="production", instance="i-1", push_kind="password_changed", outcome="delivered"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: ApiPushDeliveryFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: ApiPushDeliveryFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              push_kind: password_changed
            exp_annotations:
              summary: 'password_changed push notification was given up on (api, production)'
              description: '2 notification(s) failed for good in the last 30 minutes (refused by the push service, or out of attempts).'
              runbook_url: docs/incident-response.md#19-push-notifications-not-delivered
              dashboard_uid: app-api

  # Uninstalled apps: their tokens die, their devices are disabled. Normal.
  - name: dead push tokens do not warn
    interval: 1m
    input_series:
      - series: 'app_push_deliveries_total{job="api", deployment_environment_name="production", instance="i-1", push_kind="password_changed", outcome="unregistered"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiPushDeliveryFailed
        exp_alerts: []

  # A minimum above the version in the store: 30 % of the requests are
  # refused (the iOS installs, each trying once per launch), steadily.
  - name: most installs of a platform refused as outdated warns
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/items", http_response_status_code="200"}'
        values: '0+70x60'
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_response_status_code="426"}'
        values: '0+30x60'
      - series: 'app_client_outdated_total{job="api", deployment_environment_name="production", instance="i-1", app_platform="ios"}'
        values: '0+30x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiClientsRefusedAsOutdated
        exp_alerts: []
      - eval_time: 45m
        alertname: ApiClientsRefusedAsOutdated
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              deployment_environment_name: production
              app_platform: ios
            exp_annotations:
              summary: 'Installed ios apps are refused as outdated (api, production)'
              description: '30% of the requests to the API were refused with 426 (update required) for more than 30 minutes: those ios installs can only show the update screen. Check MOBILE_MIN_VERSION_* against the version the store offers.'
              runbook_url: docs/incident-response.md#15-installed-apps-refused-as-outdated
              dashboard_uid: app-api

  # A minimum raised for a version the store offers: the few installs not
  # updated yet are refused once per launch, 3 % of the requests.
  - name: the outdated installs left after raising a minimum do not alert
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_route="/api/items", http_response_status_code="200"}'
        values: '0+97x60'
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="production", instance="i-1", http_response_status_code="426"}'
        values: '0+3x60'
      - series: 'app_client_outdated_total{job="api", deployment_environment_name="production", instance="i-1", app_platform="android"}'
        values: '0+3x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: ApiClientsRefusedAsOutdated
        exp_alerts: []

  # A quiet environment (staging): half of a handful of requests is not a
  # population of installs.
  - name: a handful of refused requests does not alert
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="staging", instance="i-1", http_route="/api/items", http_response_status_code="200"}'
        values: '0+1x60'
      - series: 'http_server_request_duration_seconds_count{job="api", deployment_environment_name="staging", instance="i-1", http_response_status_code="426"}'
        values: '0+1x60'
      - series: 'app_client_outdated_total{job="api", deployment_environment_name="staging", instance="i-1", app_platform="ios"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: ApiClientsRefusedAsOutdated
        exp_alerts: []
