# Weekly update pull requests; each one runs the full CI like any other.
# The seven-day cooldown matches the supply-chain delay in pnpm-workspace.yaml
# (minimumReleaseAge): a younger version would not install. Security updates
# (Dependabot alerts) are not delayed by the cooldown (SECURITY.md#dependencies).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # The Expo SDK fixes the versions of React, React Native, the Expo
    # modules and the libraries with native code: they move together, in an
    # SDK upgrade (`pnpm exec expo install expo@^<next> --fix`,
    # docs/RELEASES.md#expo-sdk-upgrades), never one by one. Patch releases
    # within the SDK's ranges still come here; expo-doctor in CI rejects
    # anything the SDK does not support.
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: expo-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@expo/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The SDK pins these two to one exact version (not a range): even a patch
      # fails expo-doctor, so they move only with an SDK upgrade.
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@react-native/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@sentry/react-native'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/jest'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # @types/node describes the Node.js major of .nvmrc and moves with it, by
      # hand: a newer major types APIs the runtime does not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # ESLint 10 is not supported yet by eslint-config-expo's plugins.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - jest-expo
          - react
          - '@types/react'
          - react-native
          - react-native-*
          - '@react-native/*'
          - '@sentry/react-native'
        update-types: [patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # The tool images CI runs (.github/tool-images/Dockerfile): tag and digest
  # updated together.
  - package-ecosystem: docker
    directory: /.github/tool-images
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ['*']
    commit-message:
      prefix: ci
