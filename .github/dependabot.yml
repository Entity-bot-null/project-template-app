# Weekly update pull requests; each one runs the full CI like any other.
# The seven-day cooldown matches the supply-chain delay in pnpm-workspace.yaml
# (minimumReleaseAge): a younger version would not install. Security updates
# (Dependabot alerts) are not delayed by the cooldown (SECURITY.md#dependencies).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # The Expo SDK fixes the versions of React, React Native, the Expo
    # modules and the libraries with native code: they move together, in an
    # SDK upgrade (`pnpm --filter mobile exec expo install expo@^<next> --fix`,
    # docs/releases.md#expo-sdk-upgrades), never one by one. Patch releases
    # within the SDK's ranges still come here; expo-doctor in CI rejects
    # anything the SDK does not support.
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: expo-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@expo/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Versioned with the SDK too (expo/bundledNativeModules.json), and checked
      # by expo-doctor although it is a development tool.
      - dependency-name: eslint-config-expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The SDK pins these two to one exact version (not a range): even a patch
      # fails expo-doctor, so they move only with an SDK upgrade.
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@react-native/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@sentry/react-native'
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Jest moves to the major jest-expo depends on (babel-jest), in an SDK
      # upgrade; TypeScript once typescript-eslint supports the new version.
      # By hand: docs/ci-cd.md#keeping-the-stack-current.
      - dependency-name: jest
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/jest'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # @types/node describes the Node.js major of .nvmrc and moves with it, by
      # hand: a newer major types APIs the runtime does not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # ESLint 10 is not supported yet by eslint-config-expo's plugins.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # 2.x and later need ESLint 10, which Expo's configuration does not
      # accept yet (docs/adr/0002-pnpm-monorepo.md): with ESLint, by hand.
      - dependency-name: eslint-plugin-astro
        update-types: [version-update:semver-major]
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - jest-expo
          - eslint-config-expo
          - react
          - '@types/react'
          - react-native
          - react-native-*
          - '@react-native/*'
          - '@sentry/react-native'
        update-types: [patch]
      # Prisma's CLI, client and driver adapter work only at one version
      # (scripts/dependency-policy.json, releaseSets): one pull request moves
      # the three, majors included. When the install policy refuses one of the
      # new versions (a trust downgrade, SECURITY.md#dependencies), Dependabot
      # opens the pull request with the others and `pnpm deps:check` fails it
      # until all three can move.
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
      # The two catch-all groups match every name ('*') on purpose. A
      # dependency that several groups match goes to the most specific one
      # (Dependabot's updater scores the patterns: an exact name 1000, a group
      # with no patterns 500, `expo-*` or `@prisma/*` about 90, `*` 1), not to
      # the first one listed: without '*' these two outranked the groups above,
      # and `@prisma/client` or `expo-router` came in them, apart from their
      # set.
      development:
        patterns: ['*']
        dependency-type: development
        update-types: [minor, patch]
      production:
        patterns: ['*']
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # The workflows, and the composite action they share (.github/actions/setup):
  # '/' alone covers .github/workflows and a root action.yml only.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # The base images of the server images (apps/api/Dockerfile and the web
  # image, apps/landing/Dockerfile).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/landing
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The Node.js major follows .nvmrc and engines, by hand, together with
      # the build: a major can drop what the images rely on (Node.js 25 no
      # longer bundles corepack, which installs pnpm here).
      - dependency-name: docker/library/node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build

  # The tool images CI runs (scripts/tool-images/Dockerfile): tag and digest
  # updated together. Outside .github/ on purpose: Dependabot may open pull
  # requests that change files there only for GitHub Actions, and refused
  # every one of these (dependabot/dependabot-core#15237).
  - package-ecosystem: docker
    directory: /scripts/tool-images
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A PostgreSQL or Redis major moves by hand, with docker-compose.yml and,
      # for PostgreSQL, the managed database and its data
      # (docs/ci-cd.md#keeping-the-stack-current): CI tests the version that runs.
      - dependency-name: docker/library/postgres
        update-types: [version-update:semver-major]
      - dependency-name: docker/library/redis
        update-types: [version-update:semver-major]
      # The Ubuntu release of the cloud-init check is the servers' LTS: only
      # new digests of it. Dependabot reads an interim release (24.10, whose
      # archive closes when its nine months of support end) as a minor update
      # and the next LTS as a major one; the next LTS moves CI, the servers and
      # this image together, by hand (docs/ci-cd.md#ubuntu).
      - dependency-name: docker/library/ubuntu
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      tools:
        patterns: ['*']
    commit-message:
      prefix: ci

  # docker-compose.yml: the development services and the production-like
  # stack's images; and the reference server deployment's pinned images:
  # Caddy, PostgreSQL and Redis (deploy/vps/compose.yaml).
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/vps
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Majors by hand, with the CI images above: a PostgreSQL data directory
      # (the development volume, and a server's that runs the database) does
      # not start under the next major; it is dumped and restored
      # (docs/ci-cd.md#postgresql-and-redis).
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build

  # The Terraform providers of infra/terraform/digitalocean: the exact version
  # in versions.tf and the checksums of .terraform.lock.hcl, for the platforms
  # the lock file already lists, updated together.
  - package-ecosystem: terraform
    directory: /infra/terraform/digitalocean
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
