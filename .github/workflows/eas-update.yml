name: EAS update
run-name: OTA update of ${{ inputs.ref }} to ${{ inputs.channel }} (${{ inputs.rollout }}%)

# Publishes an over-the-air JavaScript update from a commit on main, after
# every gate passed on that exact commit (docs/RELEASES.md#ota-updates). It
# reaches only the channel's builds whose native fingerprint (runtime
# version) matches, so it can never run on a binary without the native code
# it needs. Manual only, like eas-build.yml: EXPO_TOKEN exists only in the
# protected GitHub environments. Roll back with eas-rollback.yml.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel (and EAS environment)
        type: choice
        options: [preview, production]
        required: true
      ref:
        description: What to publish, on main (branch, release tag or commit SHA)
        type: string
        required: true
        default: main
      message:
        description: What changed (shown in the update history)
        type: string
        required: true
      rollout:
        description: Percentage of users who get it now (raise later with eas update:edit)
        type: choice
        options: ['100', '50', '25', '10', '5', '1']
        default: '100'

permissions:
  contents: read

env:
  # EAS CLI is not a project dependency (expo-doctor): this exact version runs
  # here. Raise it by hand; keep it at or above eas.json cli.version.
  EAS_CLI_VERSION: 24.8.0

jobs:
  resolve:
    name: Resolve the commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        uses: ./.github/actions/resolve-main
        with:
          ref: ${{ inputs.ref }}

  gates:
    name: Gates
    needs: resolve
    uses: ./.github/workflows/quality-gates.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish to ${{ inputs.channel }}
    needs: [resolve, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.channel }}
    # One publication or rollback per channel at a time (eas-rollback.yml
    # shares the group). Here, not on the whole run: the gates must not hold
    # back a rollback that is waiting.
    concurrency:
      group: eas-update-${{ inputs.channel }}
      cancel-in-progress: false
    env:
      # Source maps go to Sentry only when this environment has everything the
      # upload needs: the repository variables SENTRY_ORG and SENTRY_PROJECT
      # and the environment secret SENTRY_AUTH_TOKEN (optional for preview,
      # docs/CI_CD.md#environments). Without them the upload is skipped with a
      # notice, instead of failing the run after the update is published.
      SENTRY_UPLOAD: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' && secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The app config is read here as a development one: a preview or
      # production config requires EXPO_PUBLIC_API_URL, which only the EAS
      # environment holds, and reading it would fail before anything is
      # published. The project id is the same in every variant.
      - run: node scripts/check-eas-project.mjs
      # The EAS environment of the same name supplies the other public
      # variables (API URL, Sentry DSN), as it does for builds.
      - name: Publish the update
        env:
          # The channel's build variant, as eas.json sets it for its builds:
          # the same app config gives the same runtime version (fingerprint).
          # This step only: the steps before and after read the app config
          # without the EAS environment (see above).
          APP_VARIANT: ${{ inputs.channel }}
          EXPO_PUBLIC_APP_ENV: ${{ inputs.channel == 'production' && 'production' || 'staging' }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          args=(--channel "$CHANNEL" --environment "$CHANNEL" --message "$MESSAGE" --non-interactive)
          if [[ "$ROLLOUT" != '100' ]]; then args+=(--rollout-percentage "$ROLLOUT"); fi
          pnpm dlx "eas-cli@$EAS_CLI_VERSION" update "${args[@]}"
      # Readable stack traces for errors raised by this update's code, when
      # the Sentry settings are all there (SENTRY_UPLOAD above).
      - name: Upload source maps to Sentry
        if: ${{ env.SENTRY_UPLOAD == 'true' }}
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm exec sentry-expo-upload-sourcemaps dist
      - name: Note the skipped source map upload
        if: ${{ env.SENTRY_UPLOAD != 'true' }}
        run: >-
          echo "::notice title=Source maps not uploaded::This environment does not have
          SENTRY_ORG, SENTRY_PROJECT and SENTRY_AUTH_TOKEN all set, so stack traces of this
          update stay minified in Sentry (docs/CI_CD.md#secrets-and-variables)."
