name: Quality gates

# Reusable: every gate a commit must pass, the same ones `pnpm verify` runs
# locally plus the API's integration suite and the server images
# (docs/ci-cd.md). Called by CI on every pull request and push to main, and by
# the EAS build and update workflows for the exact commit they ship. No
# secrets: nothing here talks to EAS, the stores or a registry.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (default the triggering commit).
        type: string
        default: ''

permissions:
  contents: read

env:
  # The integration suite derives `<db>_test` from it.
  DATABASE_URL: postgresql://app:app@localhost:5432/app
  # Tool images hosted on Docker Hub or ECR Public are pulled through this
  # mirror, by digest (scripts/tool-image.mjs): both limit anonymous pulls per
  # address, and runners share theirs.
  TOOL_IMAGE_MIRROR: mirror.gcr.io
  # No update check or usage data from the Prisma CLI (prisma generate, the
  # integration suite's migrations), as in the images.
  CHECKPOINT_DISABLE: '1'

jobs:
  # The pinned PostgreSQL, Redis and Mailpit images of scripts/tool-images/Dockerfile
  # (updated by Dependabot, tag and digest), for the service containers below,
  # which cannot read a file themselves: the mirror's copy, by the same
  # digest, when the mirror has it (a service container cannot fall back to
  # another registry), the pinned reference otherwise.
  tool-images:
    name: Tool images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      postgres: ${{ steps.images.outputs.postgres }}
      redis: ${{ steps.images.outputs.redis }}
      mailpit: ${{ steps.images.outputs.mailpit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts/tool-images
            scripts/tool-image.mjs
          sparse-checkout-cone-mode: false
      - id: images
        run: |
          {
            echo "postgres=$(node scripts/tool-image.mjs --mirrored postgres)"
            echo "redis=$(node scripts/tool-image.mjs --mirrored redis)"
            echo "mailpit=$(node scripts/tool-image.mjs --mirrored mailpit)"
          } >> "$GITHUB_OUTPUT"

  static:
    name: Format, lint, types, workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      # Includes the contract check: apps/mobile/src/api/schema.d.ts matches
      # openapi/openapi.json (the API's side is its drift spec, in the unit job).
      - run: pnpm typecheck
      # The repository tooling's own tests (scripts/*.test.mjs and
      # apps/*/scripts/*.test.mjs): Doberman's engine, the dependency policy,
      # the tool images, the migrations' contract steps, the mock API against
      # the contract.
      - run: pnpm test:scripts
      # actionlint, zizmor and shellcheck on the Git hooks: the pinned images
      # of scripts/tool-images/Dockerfile (docs/ci-cd.md#workflow-security).
      # The token, read-only here, enables zizmor's impostor-commit check.
      - name: Lint GitHub workflows and hooks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lint-workflows.mjs

  doctor:
    name: Expo doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Dependency versions against the Expo SDK, duplicate native modules,
      # config and New Architecture compatibility.
      - run: pnpm expo:doctor

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Any finding fails (SECURITY.md#static-analysis). No install needed.
      - run: node scripts/sast.mjs

  unit:
    name: Unit, component and integration tests, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Fails below the coverage thresholds of apps/mobile/jest.config.js,
      # apps/api/vitest.config.ts and apps/landing/vitest.config.ts; includes
      # the API's OpenAPI drift spec.
      - run: pnpm test:coverage
      - name: Upload the coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: apps/*/coverage/
          retention-days: 14

  integration:
    name: Integration tests (API + PostgreSQL + Redis + Mailpit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: tool-images
    env:
      # The Redis-backed adapters' specs and the mail outbox's run against
      # these throwaway servers; in CI a missing one fails them instead of
      # skipping them.
      REDIS_TEST_URL: redis://localhost:6379
      MAIL_TEST_SMTP_URL: smtp://localhost:1025
      MAILPIT_TEST_URL: http://localhost:8025
    services:
      postgres:
        # Digest-pinned: scripts/tool-image.mjs refuses a reference without one.
        image: ${{ needs.tool-images.outputs.postgres }} # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        # Digest-pinned: scripts/tool-image.mjs refuses a reference without one.
        image: ${{ needs.tool-images.outputs.redis }} # zizmor: ignore[unpinned-images]
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        # Digest-pinned: scripts/tool-image.mjs refuses a reference without one.
        image: ${{ needs.tool-images.outputs.mailpit }} # zizmor: ignore[unpinned-images]
        env:
          # Lets the outbox specs make it refuse messages (451, 550) on demand.
          MP_ENABLE_CHAOS: 'true'
          MP_SMTP_DISABLE_RDNS: 'true'
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:integration

  security:
    name: Security (dependencies, licenses, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Full history, so the secret scan also sees commits that were reverted.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Known vulnerabilities (high and critical fail), the dependency policy
      # (registry sources, licenses) and secrets in the tree.
      - run: pnpm security
      - name: Secrets in the git history (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo"
          "$(node scripts/tool-image.mjs gitleaks)"
          git /repo --redact --no-banner

  build:
    name: Build, budget and native projects
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # A production configuration with a placeholder API: what is checked
      # is that the release bundle builds and fits its budget.
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The API, the landing, and Hermes bytecode for both platforms (the
      # app's export), then the landing's performance-budget.json and
      # apps/mobile/bundle-budget.json.
      - run: pnpm build
      - run: pnpm perf:check
      # The config plugins produce both native projects (no compilation:
      # EAS builds compile; the Android end-to-end workflow too).
      - name: Generate the native projects
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --no-install --platform all

  e2e:
    name: End-to-end tests (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The web image's base images from the mirror, by digest
      # (scripts/e2e-web-image.mjs, as in docker-images.yml).
      TOOL_IMAGE_MIRROR: mirror.gcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the browser's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # The landing for its preview server; the web image is built by the
      # suite itself (playwright.config.ts).
      - run: pnpm --filter landing build
      - run: pnpm test:e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  images:
    name: Images
    uses: ./.github/workflows/docker-images.yml
    with:
      ref: ${{ inputs.ref }}
      push: false
