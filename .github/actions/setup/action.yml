name: Setup
description: >-
  pnpm (the version in package.json "packageManager"), Node.js (the version in
  .nvmrc) with the pnpm store cached, and the locked dependencies. The install
  fails when pnpm-lock.yaml does not match package.json (dependency
  validation) or a release breaks the supply-chain policies in
  pnpm-workspace.yaml.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install locked dependencies
      shell: bash
      env:
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
